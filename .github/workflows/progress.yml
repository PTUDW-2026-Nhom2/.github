name: Cập nhật tiến độ README

on:
  schedule:
    # Mỗi 30 phút trong 08:00–00:30 GMT+7 (01:00–17:30 UTC) — ban đêm không chạy.
    # Board Projects v2 đổi Status không phát event nào cho Actions nên phải poll bằng cron.
    - cron: '*/30 1-17 * * *'
  # CulinaryBlog bắn sang khi có PR/issue mới để cột PR cập nhật ngay, không đợi cron.
  repository_dispatch:
    types: [progress]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sinh bảng phân chia công việc
        env:
          GH_TOKEN: ${{ secrets.OW_GH_TOKEN }}
        run: ./scripts/gen-progress.sh

      - name: Commit nếu có thay đổi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet profile/README.md && echo 'không có thay đổi' && exit 0
          git commit -am 'chore(docs): cập nhật tiến độ công việc' && git push
